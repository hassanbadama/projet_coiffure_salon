server.port=8079
#connexion sur eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#decouverte dynamique des routes
spring.cloud.gateway.discovery.locator.enabled=true






spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true


spring.cloud.gateway.routes[0].id=service-users
spring.cloud.gateway.routes[0].uri=lb://SERVICE-USERS
spring.cloud.gateway.routes[0].predicates[0]=Path=/SERVICE-USERS/**

spring.cloud.gateway.routes[1].id=service-rendezvous
spring.cloud.gateway.routes[1].uri=lb://SERVICE-RENDEZVOUS
spring.cloud.gateway.routes[1].predicates[0]=Path=/rendezvous/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1


spring.cloud.gateway.routes[2].id=service-modele
spring.cloud.gateway.routes[2].uri=lb://SERVICE-MODELE
spring.cloud.gateway.routes[2].predicates[0]=Path=/modeles/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=service-notification
spring.cloud.gateway.routes[3].uri=lb://SERVICE-NOTIFICATION
spring.cloud.gateway.routes[3].predicates[0]=Path=/notifications/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1


spring.cloud.gateway.routes[4].id=sevice_emploi_temp
spring.cloud.gateway.routes[4].uri=lb://SERVICE_EMPLOI_TEMPS
spring.cloud.gateway.routes[4].predicates[0]=Path=/emploi/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1







