server.port=8079
#connexion sur eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#decouverte dynamique des routes
spring.cloud.gateway.discovery.locator.enabled=true






spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true


spring.cloud.gateway.routes[0].id=service-users
spring.cloud.gateway.routes[0].uri=lb://SERVICE-USERS
spring.cloud.gateway.routes[0].predicates[0]=Path=/SERVICE-USERS/**





